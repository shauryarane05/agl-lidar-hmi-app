name: agl_lidar_demo
description: "A Flutter HMI for Automotive Grade Linux that renders a live top-down LiDAR and perception view streamed over rosbridge."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # rosbridge (WebSocket) client for the live ROS 2 / rosbag LiDAR stream
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
